  // ---- TYPING RACE: client-side ----
  let typingRoster = [];       // [{id,name,avatar}] for the current round
  let typingFinishedIds = {};  // ids that have finished this round, for local display
  let typingLastSentPct = -1;

  function renderTypingRound(data){
    show('screen-typing');
    typingRoster = data.players || [];
    typingFinishedIds = {};
    typingLastSentPct = -1;
    typingText = data.text || '';
    typingRoundStartLocal = Date.now();
    document.getElementById('typingRoundCount').textContent = data.tieBreak ? '⚔️ TIE-BREAKER' : (data.total > 1 ? ('Round ' + (data.index+1) + ' of ' + data.total) : 'TYPE FAST');
    buildRaceTrack();
    renderTypingText('');
    const input = document.getElementById('typingInput');
    const feedback = document.getElementById('typingFeedback');
    const me = typingRoster.find(function(p){ return p.id === myId; });
    const iAmSpectating = !!(data.isEliminationRound && me && me.eligible === false);
    input.value = '';
    if(iAmSpectating){
      input.disabled = true;
      input.placeholder = "You're spectating this round…";
      feedback.textContent = data.tieBreak ? "Tie-breaker — only the tied players race. Cheer them on!" : "You didn't make the top 4 — spectating this round.";
      feedback.className = 'feedback-text';
    } else {
      input.disabled = false;
      input.placeholder = 'Start typing here…';
      input.focus();
      feedback.textContent = '';
      feedback.className = 'feedback-text';
    }
    document.getElementById('typingWpm').textContent = '0 WPM';
    document.getElementById('typingAccuracy').textContent = '100% accuracy';
  }

  function carNoFlip(emoji){
    const car = TYPING_CHARACTERS.find(function(c){ return c.emoji === emoji; });
    return !!(car && car.noFlip);
  }

  function buildRaceTrack(){
    const wrap = document.getElementById('raceTrackWrap');
    wrap.innerHTML = '';
    typingRoster.forEach(function(p, i){
      const isYou = p.id === myId;
      const isOut = p.eligible === false;
      const lane = document.createElement('div');
      lane.className = 'race-lane' + (isYou ? ' is-you' : '') + (isOut ? ' is-out' : '');
      lane.id = 'raceLane-' + p.id;
      const avatar = p.avatar || '🚗';
      lane.innerHTML =
        '<div class="race-lane-label">' + escapeHtml(p.name) + (isYou ? ' (you)' : '') + (isOut ? ' (out)' : '') + '</div>' +
        '<div class="race-lane-track">' +
          '<div class="race-runner" id="raceRunner-' + p.id + '"><span class="race-car-icon' + (carNoFlip(avatar) ? ' no-flip' : '') + '">' + avatar + '</span></div>' +
        '</div>' +
        '<div class="race-lane-finish">🏁</div>';
      wrap.appendChild(lane);
    });
  }

  function updateRaceTrackFor(id, pct){
    const runner = document.getElementById('raceRunner-' + id);
    if(!runner) return;
    const clamped = Math.max(0, Math.min(100, pct));
    runner.style.left = clamped + '%';
    if(clamped >= 100) runner.classList.add('finished');
  }

  function handleTypingFinishUpdate(data){
    typingFinishedIds[data.id] = data.place;
    updateRaceTrackFor(data.id, 100);
    const placeLabel = data.place === 1 ? '🥇 1st' : data.place === 2 ? '🥈 2nd' : data.place === 3 ? '🥉 3rd' : (data.place + 'th');
    toast(data.name + ' finished ' + placeLabel + '!');
    if(data.id === myId){
      const el = document.getElementById('typingFeedback');
      el.textContent = data.place === 1 ? 'You finished first! 🎉' : ('You finished ' + placeLabel + '!');
      el.className = 'feedback-text good';
    }
  }

  function renderTypingText(typed){
    const el = document.getElementById('typingTextDisplay');
    let html = '';
    for(let i=0; i<typingText.length; i++){
      const ch = typingText[i];
      let cls = 'pending';
      if(i < typed.length) cls = (typed[i].toLowerCase() === ch.toLowerCase()) ? 'correct' : 'incorrect';
      else if(i === typed.length) cls += ' current';
      html += '<span class="typing-char ' + cls + '">' + escapeHtml(ch) + '</span>';
    }
    el.innerHTML = html;
  }

  function emitTypingProgress(pct){
    if(role === 'host'){ hostRelayTypingProgress('host', pct); }
    else if(hostConn){ hostConn.send({type:'typingProgress', pct:pct}); }
  }

  function emitTypingFinish(timeMs){
    if(role === 'host'){ handleTypingFinish('host', timeMs); }
    else if(hostConn){ hostConn.send({type:'typingFinish', timeMs:timeMs}); }
  }

  const typingInputEl = document.getElementById('typingInput');
  typingInputEl.addEventListener('paste', function(e){
    e.preventDefault();
    toast('🚫 No pasting — type it out!', 1200);
  });
  typingInputEl.addEventListener('drop', function(e){ e.preventDefault(); });
  typingInputEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  typingInputEl.addEventListener('input', function(){
    if(!typingText) return;
    let typed = this.value;

    // correctCount = length of the correctly-typed prefix
    let correctCount = 0;
    while(correctCount < typed.length && correctCount < typingText.length && typed[correctCount].toLowerCase() === typingText[correctCount].toLowerCase()){
      correctCount++;
    }
    if(correctCount < typed.length){
      // A wrong character was typed — reject it and warn instead of letting it stick.
      typed = typed.slice(0, correctCount);
      this.value = typed;
      toast('❌ Not quite — check the letter and try again.', 1200);
    }
    renderTypingText(typed);

    const pct = Math.round((correctCount / typingText.length) * 100);
    if(pct !== typingLastSentPct){
      typingLastSentPct = pct;
      updateRaceTrackFor(myId, pct);
      emitTypingProgress(pct);
    }

    const elapsedMin = Math.max((Date.now() - typingRoundStartLocal) / 60000, 1/60);
    const wpm = Math.round((typed.length / 5) / elapsedMin);
    const accuracy = typed.length ? Math.round((correctCount / typed.length) * 100) : 100;
    document.getElementById('typingWpm').textContent = wpm + ' WPM';
    document.getElementById('typingAccuracy').textContent = accuracy + '% accuracy';

    if(typed.toLowerCase() === typingText.toLowerCase()){
      const timeMs = Date.now() - typingRoundStartLocal;
      this.disabled = true;
      emitTypingFinish(timeMs);
    }
  });

  // ---- RENDERING ----
  // Keyed diffing: rows are matched by data-player-id and updated in place
  // instead of the list being wiped and rebuilt on every update. That's what
  // makes the join animation and ready-pulse mean something — without it,
  // the quality dots updating every few seconds would replay every
  // animation and make the whole list flicker.
  let prevReadyState = {};   // playerId -> bool, to detect the false→true ready transition
  let playerRowEls = {};     // playerId -> <li> element currently in the DOM

  // Re-adds a one-shot CSS animation class, forcing a reflow first so it
  // replays correctly even if the class is still present from a prior run.
  function triggerAnim(el, className){
    el.classList.remove(className);
    void el.offsetWidth;
    el.classList.add(className);
    el.addEventListener('animationend', function onEnd(e){
      if(e.target !== el) return;
      el.classList.remove(className);
      el.removeEventListener('animationend', onEnd);
    });
  }

  function renderLobby(list){
    lastPlayerList = list;
    const ul = $('#playerList');
    const seenIds = {};

    list.forEach(function(p, i){
      seenIds[p.id] = true;
      const color = AVATAR_COLORS[i % AVATAR_COLORS.length];
      let li = playerRowEls[p.id];
      const isNewRow = !li;
      if(isNewRow){
        li = document.createElement('li');
        li.className = 'player-item';
        li.dataset.playerId = p.id;
        playerRowEls[p.id] = li;
      }
      // Keep DOM order in sync with the incoming list order without
      // discarding existing nodes (that's what preserves animations).
      if(ul.children[i] !== li){
        ul.insertBefore(li, ul.children[i] || null);
      }
      updatePlayerRow(li, p, color, isNewRow);
    });

    // Drop rows for players who are no longer in the roster.
    Object.keys(playerRowEls).forEach(function(id){
      if(!seenIds[id]){
        playerRowEls[id].remove();
        delete playerRowEls[id];
        delete prevReadyState[id];
      }
    });

    populateCharPicker();
  }

  function updatePlayerRow(li, p, color, isNewRow){
    const initials = p.name.slice(0,2).toUpperCase();
    const isMe = p.id === myId;
    const isHostRow = p.id === 'host';
    const avatarInner = p.avatar ? p.avatar : initials;
    const canRemove = role === 'host' && p.id !== 'host' && p.id !== myId;

    const wasReady = !!prevReadyState[p.id];
    const justBecameReady = !p.disconnected && !!p.ready && !wasReady;
    prevReadyState[p.id] = !!p.ready;

    // The host isn't pinged (there's no round trip to itself), so it's
    // always shown as excellent rather than carrying a stale/blank tier.
    const qualityTier = isHostRow ? 'excellent' : (p.quality || null);
    // Kept the internal tier names (excellent/good/poor) for the CSS classes
    // and RTT-based classification logic, but the visible label uses plain
    // connected/unstable language — "excellent vs. good" reads like a
    // technical benchmark to non-technical players, when what they actually
    // want to know is just "is this person's connection okay?"
    const QUALITY_LABELS = {excellent:'🟢 Connected', good:'🟡 Slightly unstable', poor:'🔴 Poor connection'};
    const qualityDot = (!p.disconnected && qualityTier)
      ? '<div class="quality-dot ' + qualityTier + '" title="' + (QUALITY_LABELS[qualityTier] || 'Connected') + '"></div>'
      : '';

    const hostPill = isHostRow ? '<span class="host-pill">👑 Host</span>' : '';

    const statusBadge = p.disconnected
      ? '<div class="ready-badge waiting">🔄 Reconnecting…</div>'
      : '<div class="ready-badge ' + (p.ready ? 'ready' : 'waiting') + (justBecameReady ? ' pop' : '') + '">' + (p.ready ? '✓ Ready' : 'Waiting') + '</div>';

    li.innerHTML =
      '<div class="player-avatar" style="background:' + color + '20;color:' + color + (p.disconnected ? ';opacity:.5' : '') + '">' + avatarInner + qualityDot + '</div>' +
      '<div class="player-name-text' + (p.disconnected ? '" style="opacity:.5' : '') + '">' + escapeHtml(p.name) + hostPill + (isMe ? ' <span style="color:var(--muted);font-size:.8rem">(you)</span>' : '') + '</div>' +
      statusBadge +
      (canRemove ? '<button type="button" class="player-remove-btn" data-player-id="' + p.id + '" title="Remove player" aria-label="Remove ' + escapeHtml(p.name) + '">✕</button>' : '');

    if(canRemove){
      li.querySelector('.player-remove-btn').addEventListener('click', function(){
        showConfirm('Remove ' + p.name + ' from the room?', function(){ hostRemovePlayer(p.id, p.name); }, 'Yes, Remove');
      });
    }

    if(isNewRow) triggerAnim(li, 'player-item-enter');
    if(justBecameReady) triggerAnim(li, 'ready-pulse');
  }

  // Floats a reaction emoji up from a specific player's row. Silently no-ops
  // if that row isn't currently rendered (e.g. mid-transition between screens).
  function showFloatingReaction(playerId, emoji){
    const li = playerRowEls[playerId];
    if(!li) return;
    const span = document.createElement('span');
    span.className = 'reaction-float';
    span.textContent = emoji;
    li.appendChild(span);
    span.addEventListener('animationend', function(){ span.remove(); });
    setTimeout(function(){ if(span.parentNode) span.remove(); }, 1500);
  }

  // ---- HOST: remove a player from the waiting room ----
  function hostRemovePlayer(playerId, playerName){
    if(role !== 'host') return;
    sendToPlayer(playerId, {type:'kicked'});
    setTimeout(function(){
      const p = players[playerId];
      if(p && p.conn){ try{ p.conn.close(); }catch(e){} }
      delete players[playerId];
      broadcastPlayers();
      // If we're mid-collection for Guess Who or Two Truths, re-check whether
      // everyone remaining has now submitted (removing a straggler can complete it).
      if(gamePhase === 'collecting' && activeGame === 'guesswho'){
        broadcastGuessWhoProgress();
        const list = Object.values(players);
        if(list.length > 0 && list.every(function(pl){ return pl.gwSubmitted; })) startGuessWhoGame();
      } else if(gamePhase === 'collecting' && activeGame === 'truths'){
        broadcastTruthsProgress();
        const list = Object.values(players);
        if(list.length > 0 && list.every(function(pl){ return pl.ttSubmitted; })) startTruthsGame();
      }
      toast(playerName + ' was removed from the room.');
    }, 250);
  }

  // ---- TYPING RACE: character picker ----
  let lastPlayerList = [];
  function populateCharPicker(){
    const grid = document.getElementById('charPickerGrid');
    if(!grid) return;
    const takenByOthers = {};
    lastPlayerList.forEach(function(p){
      if(p.avatar && p.id !== myId) takenByOthers[p.avatar] = true;
    });
    grid.innerHTML = '';
    TYPING_CHARACTERS.forEach(function(car){
      const emoji = car.emoji;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'char-swatch' + (emoji === myAvatar ? ' active' : '') + (takenByOthers[emoji] ? ' taken' : '');
      btn.textContent = emoji;
      btn.title = car.label;
      btn.setAttribute('aria-label', 'Pick car ' + car.label);
      btn.disabled = !!takenByOthers[emoji] && emoji !== myAvatar;
      btn.addEventListener('click', function(){ chooseCharacter(emoji); });
      grid.appendChild(btn);
    });
  }

  function chooseCharacter(emoji){
    myAvatar = emoji;
    if(role === 'host'){
      if(players['host']) players['host'].avatar = emoji;
      broadcastPlayers();
    } else if(hostConn){
      hostConn.send({type:'charPick', avatar:emoji});
    }
  }

  function updateLiveScores(scores){
    lastScoresRendered = scores;
    renderLiveScoreHTML(scores);
  }

  function renderLiveScoreHTML(scores){
    const discMap = {};
    latestPlayersSnapshot.forEach(function(p){ discMap[p.id] = !!p.disconnected; });
    const sorted = scores.slice().sort(function(a,b){ return b.score - a.score; });
    const html = sorted.map(function(s, i){
      const disc = s.id && discMap[s.id];
      return '<div class="score-row' + (i===0?' leader':'') + (disc ? ' reconnecting' : '') + '">' +
        '<span class="score-name">' + escapeHtml(s.name) + (disc ? ' <span title="Reconnecting…" aria-label="Reconnecting">🔄</span>' : '') + '</span>' +
        (i===0 && !disc ? '<span style="font-size:.9rem">👑</span>' : '') +
        '<span class="score-pts">' + s.score + '</span>' +
        '</div>';
    }).join('');
    ['liveScores','liveScoresDoodle'].forEach(function(id){
      const el = document.getElementById(id);
      if(el) el.innerHTML = html;
    });
  }

  function addWrongAnswerBubble(text, containerId){
    const id = containerId || 'wrongAnswers';
    const stack = document.getElementById(id);
    if(!stack) return;
    SFX.wrong();
    const b = document.createElement('div');
    b.className = 'wrong-answer-bubble';
    b.innerHTML = '<span class="wa-icon">❌</span><span class="wa-text">' + escapeHtml(text) + '</span>';
    stack.appendChild(b);
    stack.scrollTop = stack.scrollHeight;
    const clearBtn = document.getElementById(id + '-clear');
    if(clearBtn) clearBtn.style.display = 'flex';
  }

  function clearWrongAnswers(containerId){
    const ids = containerId ? [containerId] : ['wrongAnswers','wrongAnswersDoodle','wrongAnswersCharades','wrongAnswersHenyo','wrongAnswersGuessWho','wrongAnswersTruths','wrongAnswersTrivia'];
    ids.forEach(function(id){
      const stack = document.getElementById(id);
      if(stack) stack.innerHTML = '';
      const clearBtn = document.getElementById(id + '-clear');
      if(clearBtn) clearBtn.style.display = 'none';
    });
  }

  function startRebusCountdown(seconds){
    clearInterval(rebusTimerInterval);
    const el = document.getElementById('rebusTimerText');
    if(seconds === undefined || seconds === null || seconds < 0){
      el.textContent = '';
      el.style.color = '';
      return;
    }
    let s = seconds;
    function tick(){
      el.textContent = '⏱ ' + s + 's';
      el.style.color = s <= 10 ? 'var(--accent2)' : '';
      if(s > 0 && s <= 10) SFX.tick();
      if(s <= 0){ clearInterval(rebusTimerInterval); return; }
      s--;
    }
    tick();
    rebusTimerInterval = setInterval(tick, 1000);
  }

  function renderQuestion(data){
    show('screen-play');
    clearWrongAnswers();
    startRebusCountdown(data.seconds);
    document.getElementById('qCount').textContent = 'Question ' + (data.index+1) + ' of ' + data.total;
    const container = document.getElementById('puzzleRow');
    container.innerHTML = '';
    data.parts.forEach(function(p, i){
      const piece = document.createElement('div');
      piece.className = 'rebus-piece';
      piece.style.animationDelay = (i * 0.12) + 's';
      const wrap = document.createElement('div');
      wrap.className = 'rebus-img-wrap';
      wrap.innerHTML = renderPicture(p);
      wrap.setAttribute('tabindex', '0');
      wrap.setAttribute('role', 'button');
      wrap.setAttribute('aria-label', 'Tap to enlarge picture');
      wrap.addEventListener('click', function(){ openLightbox(wrap.innerHTML); });
      wrap.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLightbox(wrap.innerHTML); }
      });
      piece.appendChild(wrap);
      container.appendChild(piece);

      if(i < data.parts.length - 1){
        const plus = document.createElement('div');
        plus.className = 'rebus-plus';
        plus.textContent = '+';
        container.appendChild(plus);
      }
    });
    const input = $('#answerInput');
    const rebusSpectating = !!(data.tbIds && data.tbIds.indexOf(myId) === -1);
    if(data.tbIds) document.getElementById('qCount').textContent = '⚔️ TIE-BREAKER';
    input.value = '';
    input.disabled = rebusSpectating;
    $('#btnGuess').disabled = rebusSpectating;
    input.placeholder = rebusSpectating ? "Tie-breaker — you're spectating…" : 'Type your answer…';
    if(!rebusSpectating) input.focus();
    const fb = document.getElementById('feedbackText');
    fb.textContent = '';
    fb.className = 'feedback-text';

    // ---- Hint setup ----
    currentHint = (data.hint && data.hint.trim()) ? data.hint.trim() : '';
    const hintBtn = document.getElementById('btnHint');
    const hintBubble = document.getElementById('hintBubble');
    hintBubble.classList.remove('visible');
    hintBtn.textContent = '💡 Show Hint';
    hintBtn.hidden = !currentHint || role !== 'host';
  }

  function renderAnswerResult(data){
    const el = document.getElementById('feedbackText');
    if(data.roundOver){
      el.textContent = 'Round already over — next picture coming up!';
      el.className = 'feedback-text';
      $('#answerInput').disabled = true;
    } else {
      el.textContent = 'Not quite — try again!';
      el.className = 'feedback-text bad';
      SFX.wrong();
      const input = $('#answerInput');
      input.classList.add('shake');
      setTimeout(function(){ input.classList.remove('shake'); }, 300);
    }
  }

  function renderRoundResult(data){
    show('screen-result');
    SFX.correct();
    clearWrongAnswers();
    const isTyping = activeGame === 'typing' || data.game === 'typing';
    const isGuessWho = activeGame === 'guesswho' || data.game === 'guesswho';
    const isTruths = activeGame === 'truths' || data.game === 'truths';
    document.getElementById('winnerLine').textContent = isTyping
      ? data.winnerName + (data.winnerName.indexOf('Nobody') === -1 ? ' won the race!' : '')
      : (isTruths ? data.winnerName : data.winnerName + ' got it!');
    document.getElementById('answerLine').textContent = isGuessWho ? ('It was ' + data.answer + '!')
      : (isTruths ? ('The lie was: “' + data.answer + '”') : (isTyping ? '' : data.answer));
    document.getElementById('answerLine').hidden = isTyping;
    const subEl = document.getElementById('guessSubline');
    if(isGuessWho && data.guessText){
      subEl.textContent = data.winnerName + ' guessed: “' + data.guessText + '”';
      subEl.hidden = false;
    } else if(isTruths && data.ownerName){
      subEl.textContent = 'These were ' + data.ownerName + "'s statements.";
      subEl.hidden = false;
    } else {
      subEl.hidden = true;
    }
    if(!isTyping){
      updateLiveScores(data.scores);
      if(!isTruths) pulseScoreFor(data.winnerName);
    }
    fireConfetti(50);
    const typingHasNextRound = isTyping && typeof data.index === 'number' && typeof data.total === 'number' && (data.index + 1) < data.total;
    const nextLabel = isTyping
      ? (typingHasNextRound ? 'Round ' + (data.index + 2) + ' — top 4 advance!' : 'Final results')
      : (activeGame === 'doodle' ? 'Next drawing' : (activeGame === 'charades' ? 'Next actor' : (activeGame === 'henyo' ? 'Next Henyo' : (isGuessWho ? 'Next round' : (isTruths ? 'Next player' : (activeGame === 'trivia' ? 'Next question' : 'Next picture'))))));
    let secs = 4;
    clearInterval(countdownInterval);
    guessWhoResultPaused = false;
    const pauseBtn = document.getElementById('btnPauseGuessWho');
    pauseBtn.textContent = '⏸ Pause for Discussion';
    pauseBtn.hidden = !(isGuessWho && role === 'host');
    document.getElementById('resultCountdown').textContent = nextLabel + ' in ' + secs + '…';
    countdownInterval = setInterval(function(){
      secs--;
      if(secs <= 0){ clearInterval(countdownInterval); return; }
      document.getElementById('resultCountdown').textContent = nextLabel + ' in ' + secs + '…';
    }, 1000);
  }

  function renderGameOver(data){
    show('screen-gameover');
    SFX.fanfare();
    const hasTie = !!(data.tied && data.tied.length >= 2);
    if(!hasTie){
      fireConfetti(90);
      setTimeout(() => fireConfetti(50), 500);
      setTimeout(() => fireConfetti(50), 1000);
    }
    const mainGame = data.origGame || activeGame;
    const isTyping = mainGame === 'typing';
    const top = data.scores.length ? data.scores[0].score : 0;
    const tbWinnerId = (data.tieBreak && data.tieBreak.winnerId) ? data.tieBreak.winnerId : null;
    document.getElementById('finalList').innerHTML = data.scores.map(function(s, i){
      const isWinner = tbWinnerId ? (s.id === tbWinnerId) : (s.score === top && top > 0);
      const winnerClass = isWinner ? 'is-winner' : '';
      const medals = ['🥇','🥈','🥉'];
      const scoreLabel = isTyping ? (s.score + (s.score === 1 ? ' win' : ' wins')) : (s.score + ' pts');
      return '<li class="final-row ' + winnerClass + '" style="animation-delay:' + (i*0.08) + 's">' +
        '<span class="final-rank">' + (medals[i] || (i+1)) + '</span>' +
        '<span class="final-name">' + escapeHtml(s.name) + (s.id===myId?' (you)':'') + (tbWinnerId && s.id === tbWinnerId ? ' 👑' : '') + '</span>' +
        '<span class="final-score">' + scoreLabel + '</span>' +
        '</li>';
    }).join('');
    const speedEl = document.getElementById('speedAwardLine');
    if(mainGame === 'truths' && data.speedAward && data.speedAward.name){
      const secs = (data.speedAward.avgMs / 1000).toFixed(1);
      speedEl.textContent = '⚡ Fastest Fingers: ' + data.speedAward.name + (data.speedAward.id===myId?' (you)':'') + ' — avg ' + secs + 's per correct answer';
      speedEl.hidden = false;
    } else {
      speedEl.hidden = true;
    }

    // ---- tie-breaker banner + picker ----
    const tbBanner = document.getElementById('tbBanner');
    const tbPanel = document.getElementById('tbPanel');
    tbBanner.hidden = true;
    tbPanel.hidden = true;
    if(data.tieBreak){
      const g = TB_GAMES.filter(function(x){ return x.key === data.tieBreak.game; })[0];
      const gl = g ? (g.emoji + ' ' + g.name) : 'tie-breaker';
      tbBanner.textContent = tbWinnerId
        ? ('👑 ' + data.tieBreak.winnerName + (tbWinnerId === myId ? ' (you)' : '') + ' wins the ' + gl + ' tie-breaker!')
        : ('😅 Nobody settled it in ' + gl + ' — still tied!');
      tbBanner.hidden = false;
    }
    if(hasTie){
      document.getElementById('tbSub').textContent = data.tied.map(function(t){ return t.name + (t.id === myId ? ' (you)' : ''); }).join(' & ') + ' are tied for first.';
      const gamesEl = document.getElementById('tbGames');
      const noteEl = document.getElementById('tbNote');
      if(role === 'host'){
        gamesEl.innerHTML = TB_GAMES.map(function(g){
          const blocked = g.needsOutsider && !data.tieOutsiders;
          return '<button type="button" class="btn btn-primary" data-tb="' + g.key + '"' + (blocked ? ' disabled title="Needs a player outside the tie"' : '') + '>' + g.emoji + ' ' + g.name + '</button>';
        }).join('');
        gamesEl.querySelectorAll('button[data-tb]').forEach(function(btn){
          btn.addEventListener('click', function(){ startTieBreak(btn.getAttribute('data-tb')); });
        });
        noteEl.textContent = data.tieOutsiders
          ? 'Pick a tie-breaker game — only the tied players compete for one round.'
          : 'Pick a tie-breaker — Doodle Dash and Charades are off because everyone is in the tie.';
      } else {
        gamesEl.innerHTML = '';
        noteEl.textContent = 'Waiting for the host to pick a tie-breaker game…';
      }
      tbPanel.hidden = false;
    }
    $('#btnPlayAgain').hidden = (role !== 'host');
  }

  // ---- CONNECT 4: client-side board rendering ----
  function renderConnect4Live(data){
    c4Board = data.board;
    c4RedId = data.redId;
    c4YellowId = data.yellowId;
    document.getElementById('c4RedName').textContent = data.redName + (data.redId===myId?' (you)':'');
    document.getElementById('c4YellowName').textContent = data.yellowName + (data.yellowId===myId?' (you)':'');

    const canClickColumn = !!(data.turn && myId === (data.turn === 'red' ? data.redId : data.yellowId));

    const banner = document.getElementById('c4TurnBanner');
    if(data.winnerId){
      const winnerName = data.winnerId === data.redId ? data.redName : data.yellowName;
      banner.textContent = '🎉 ' + winnerName + (data.winnerId===myId?' (you)':'') + ' connects four!';
      SFX.fanfare();
      fireConfetti(60);
    } else if(data.draw){
      banner.textContent = "🤝 It's a draw — board's full!";
    } else if(data.turn){
      const turnName = data.turn === 'red' ? data.redName : data.yellowName;
      banner.textContent = canClickColumn ? '🫵 Your turn (' + data.turn + ')' : (turnName + "'s turn…");
    } else {
      banner.textContent = '';
    }

    const boardEl = document.getElementById('c4Board');
    boardEl.innerHTML = '';
    for(let col=0; col<7; col++){
      const colWrap = document.createElement('div');
      colWrap.className = 'c4-column' + (canClickColumn ? ' clickable' : ' disabled');
      colWrap.style.gridColumn = String(col+1);
      colWrap.style.display = 'flex';
      colWrap.style.flexDirection = 'column';
      colWrap.style.gap = '6px';
      for(let row=0; row<6; row++){
        const cellEl = document.createElement('div');
        const val = c4Board[row][col];
        const isNew = data.lastMove && data.lastMove.row === row && data.lastMove.col === col;
        cellEl.className = 'c4-cell' + (val ? (' ' + val) : '') + (isNew ? ' c4-new' : '');
        colWrap.appendChild(cellEl);
      }
      if(canClickColumn){
        colWrap.addEventListener('click', function(){ sendConnect4Drop(col); });
      }
      boardEl.appendChild(colWrap);
    }
    boardEl.style.gridTemplateColumns = 'repeat(7, minmax(0,1fr))';
  }

  function sendConnect4Drop(col){
    if(role === 'host'){ handleConnect4Drop('host', col); }
    else if(hostConn){ hostConn.send({type:'connect4Drop', col:col}); }
  }


  function applyIncomingMessage(data){
    if(!data || !data.type) return;
    switch(data.type){
      case 'players':
        latestPlayersSnapshot = data.players || [];
        renderLobby(data.players);
        if(role === 'host') updateStartButton(data.players);
        if(lastScoresRendered) renderLiveScoreHTML(lastScoresRendered);
        break;
      case 'ping':
        // Immediate echo so the host can measure round-trip time. Only ever
        // arrives on an actual client — the host never pings itself.
        if(role === 'client' && hostConn){ try{ hostConn.send({type:'pong', ts:data.ts}); }catch(e){} }
        break;
      case 'reaction':
        showFloatingReaction(data.playerId, data.emoji);
        break;
      case 'gameSelected':
        activeGame = data.game || 'rebus';
        activeTypingGame = activeGame === 'typing';
        if(activeGame === 'doodle'){
          doodleCategoryKey = data.category || 'animals';
          doodleRoundsPerPlayer = data.roundsPerPlayer || 1;
          doodleRoundSeconds = data.seconds || DOODLE_ROUND_SECONDS;
        } else if(activeGame === 'charades'){
          charadesCategoryKey = data.category || 'kidsEasy';
          charadesRoundsPerPlayer = data.roundsPerPlayer || 1;
          charadesRoundSeconds = (typeof data.seconds === 'number') ? data.seconds : CHARADES_ROUND_SECONDS;
        } else if(activeGame === 'henyo'){
          henyoCategoryKey = data.category || 'hayop';
          henyoRoundsPerPlayer = data.roundsPerPlayer || 1;
          henyoRoundSeconds = (typeof data.seconds === 'number') ? data.seconds : HENYO_ROUND_SECONDS;
        } else if(activeTypingGame){
          typingTopicKey = TYPING_TOPICS[data.topic] ? data.topic : 'islands';
          typingRoundsTarget = (data.rounds === 2) ? 2 : 1;
        } else if(activeGame === 'guesswho'){
          guessWhoRoundsTarget = data.rounds || 10;
          guessWhoRoundSeconds = (typeof data.seconds === 'number') ? data.seconds : -1;
          resetGuessWhoInputForm();
          show('screen-guesswhoinput');
        } else if(activeGame === 'truths'){
          truthsRoundSeconds = (typeof data.seconds === 'number') ? data.seconds : -1;
          resetTruthsInputForm();
          show('screen-truthsinput');
        } else if(activeGame === 'trivia'){
          triviaRoundSeconds = (typeof data.seconds === 'number') ? data.seconds : -1;
        } else if(activeGame === 'connect4'){
          c4GameOver = false;
        }
        break;
      case 'proceedToPicker':
        show('screen-gamepick');
        updateGamePickForRole();
        break;
      case 'enterTypingSetup':
        updateTypingSetupForRole();
        show('screen-typingsetup');
        break;
      case 'backToLobby':
        show('screen-lobby');
        break;
      case 'gameStart':
        gamePhase = 'playing';
        updateLiveScores(data.scores || []);
        if(activeGame === 'guesswho') guessWhoRoster = data.scores || [];
        show(activeGame === 'doodle' ? 'screen-doodle' : (activeGame === 'charades' ? 'screen-charades' : (activeGame === 'henyo' ? 'screen-henyo' : (activeGame === 'typing' ? 'screen-typing' : (activeGame === 'guesswho' ? 'screen-guesswho' : (activeGame === 'truths' ? 'screen-truths' : (activeGame === 'trivia' ? 'screen-trivia' : (activeGame === 'connect4' ? 'screen-connect4' : 'screen-play'))))))));
        break;
      case 'connect4State':
        renderConnect4Live(data);
        break;
      case 'question':
        renderQuestion(data);
        break;
      case 'answerResult':
        renderAnswerResult(data);
        break;
      case 'wrongAnswer':
        addWrongAnswerBubble(data.text);
        break;
      case 'doodleRound':
        renderDoodleRound(data);
        break;
      case 'doodleWordUpdate':
        if(isDrawerNow){
          document.getElementById('doodleWordBox').textContent = data.word;
          toast('✏️ Now drawing: ' + data.word, 1200);
        }
        break;
      case 'strokeBatch':
        if(!isDrawerNow && data.segs) data.segs.forEach(drawSegmentOnCanvas);
        break;
      case 'doodleClear':
        if(!isDrawerNow) clearDoodleCanvas();
        break;
      case 'doodleAnswerResult':
        renderDoodleAnswerResult(data);
        break;
      case 'doodleWrongAnswer':
        addWrongAnswerBubble(data.text, 'wrongAnswersDoodle');
        break;
      case 'charadesRound':
        renderCharadesRound(data);
        break;
      case 'charadesWordUpdate':
        if(isActorNow){
          document.getElementById('charadesWordBox').textContent = data.word;
          toast('🎭 New word: ' + data.word, 1200);
        }
        break;
      case 'charadesAnswerResult':
        renderCharadesAnswerResult(data);
        break;
      case 'charadesWrongAnswer':
        addWrongAnswerBubble(data.text, 'wrongAnswersCharades');
        break;
      case 'henyoRound':
        renderHenyoRound(data);
        break;
      case 'henyoWordUpdate':
        if(!isHenyoNow){
          document.getElementById('henyoWordBox').textContent = data.word;
          toast('🤔 New word: ' + data.word, 1200);
        }
        break;
      case 'henyoHint':
        addHenyoHintChip(data);
        break;
      case 'henyoAnswerResult':
        renderHenyoAnswerResult(data);
        break;
      case 'henyoWrongAnswer':
        addWrongAnswerBubble(data.text, 'wrongAnswersHenyo');
        break;
      case 'typingRound':
        renderTypingRound(data);
        break;
      case 'typingProgress':
        updateRaceTrackFor(data.id, data.pct);
        break;
      case 'typingFinishUpdate':
        handleTypingFinishUpdate(data);
        break;
      case 'guessWhoProgress':
        renderGuessWhoWaiting(data.players);
        startCollectionCountdown('gwWaitingBox', data.deadline);
        break;
      case 'guessWhoRound':
        renderGuessWhoRound(data);
        break;
      case 'guessWhoAnswerResult':
        renderGuessWhoAnswerResult(data);
        break;
      case 'truthsProgress':
        renderTruthsWaiting(data.players);
        startCollectionCountdown('ttWaitingBox', data.deadline);
        break;
      case 'truthsRound':
        renderTruthsRound(data);
        break;
      case 'truthsAnswerResult':
        renderTruthsAnswerResult(data);
        break;
      case 'truthsProgressPing':
        renderTruthsProgressPing(data);
        break;
      case 'triviaRound':
        renderTriviaRound(data);
        break;
      case 'triviaAnswerResult':
        renderTriviaAnswerResult(data);
        break;
      case 'triviaWrongAnswer':
        addWrongAnswerBubble(data.text, 'wrongAnswersTrivia');
        break;
      case 'roundResult':
        clearInterval(doodleTimerInterval);
        clearInterval(charadesTimerInterval);
        clearInterval(henyoTimerInterval);
        clearInterval(rebusTimerInterval);
        clearInterval(guessWhoTimerInterval);
        clearInterval(truthsTimerInterval);
        clearInterval(triviaTimerInterval);
        renderRoundResult(data);
        break;
      case 'guessWhoResultPause':
        clearInterval(countdownInterval);
        document.getElementById('resultCountdown').textContent = '⏸ Paused for discussion';
        break;
      case 'hintVisibility':
        setHintVisible(data.visible, data.hint);
        break;
      case 'triviaHintVisibility':
        setTriviaHintVisible(data.visible, data.hint);
        break;
      case 'gameOver':
        clearInterval(doodleTimerInterval);
        clearInterval(charadesTimerInterval);
        clearInterval(henyoTimerInterval);
        clearInterval(rebusTimerInterval);
        clearInterval(guessWhoTimerInterval);
        clearInterval(truthsTimerInterval);
        clearInterval(triviaTimerInterval);
        renderGameOver(data);
        break;
      case 'errorMsg':
        document.getElementById('landingError').textContent = data.message;
        clearRejoinInfo();
        show('screen-landing');
        break;
      case 'rejoinedMidGame':
        toast("You're back in! Rejoining the game in progress…");
        break;
      case 'kicked':
        wasKicked = true;
        clearRejoinInfo();
        clearInterval(doodleTimerInterval);
        clearInterval(charadesTimerInterval);
        clearInterval(henyoTimerInterval);
        clearInterval(rebusTimerInterval);
        clearInterval(guessWhoTimerInterval);
        clearInterval(truthsTimerInterval);
        clearInterval(triviaTimerInterval);
        document.getElementById('landingError').textContent = 'You were removed from the room by the host.';
        show('screen-landing');
        break;
      case 'backToPicker':
        gamePhase = 'lobby';
        amReady = false;
        clearInterval(doodleTimerInterval);
        clearInterval(charadesTimerInterval);
        clearInterval(henyoTimerInterval);
        clearInterval(rebusTimerInterval);
        clearInterval(guessWhoTimerInterval);
        clearInterval(truthsTimerInterval);
        clearInterval(triviaTimerInterval);
        guessWhoSubmitted = false;
        truthsSubmitted = false;
        $('#btnReady').textContent = "✋ I'm Ready";
        $('#btnReady').style.background = '';
        $('#btnReady').style.color = '';
        document.getElementById('lobbyQuestionInfo').textContent = '';
        show('screen-gamepick');
        updateGamePickForRole();
        break;
    }
  }

  // ---- HOST ROOM RECLAIM ----
  // If this tab was hosting a room shortly before reloading/crashing, offer
  // to reclaim the same room code so players' own auto-reconnect logic can
  // quietly relink to it, instead of the room being gone for good.
  (function checkHostReclaim(){
    try{
      const raw = localStorage.getItem(HOST_STATE_STORAGE_KEY);
      if(!raw) return;
      const info = JSON.parse(raw);
      if(!info || !info.roomCode || Date.now() - info.ts > HOST_RECLAIM_WINDOW_MS){ clearHostState(); return; }
      clearHostState(); // avoid re-prompting on every load within the window regardless of the answer
      if(!ensurePeerLib()) return;
      showConfirm('Your game (Room ' + info.roomCode + ') looks like it got interrupted — probably a reload. Reclaim it so your players can reconnect?', function(){ reclaimHostRoom(info); }, 'Reclaim Room');
    }catch(e){}
  })();

  // ---- AUTO-REJOIN ----
  // If the tab reloaded shortly after being part of an active room (e.g. iOS
  // Safari reclaiming a backgrounded tab), silently try to rejoin that room
  // using the persisted session id, within the host's disconnect grace window.
  (function attemptAutoRejoin(){
    try{
      const raw = localStorage.getItem(REJOIN_STORAGE_KEY);
      if(!raw) return;
      const info = JSON.parse(raw);
      if(!info || !info.code || !info.name) { clearRejoinInfo(); return; }
      if(Date.now() - info.ts > DISCONNECT_GRACE_MS + 10000){ clearRejoinInfo(); return; }
      myName = info.name;
      role = 'client';
      const nameInput = document.getElementById('nameInput');
      if(nameInput) nameInput.value = info.name;
      if(!ensurePeerLib()) return;
      joinRoom(info.code, true);
    }catch(e){}
  })();
})();
</script>

<script>
  // ---- Keep fixed bottom bars (guess input etc.) above the on-screen keyboard ----
  // Mobile browsers shrink the *visual* viewport when the keyboard opens but
  // leave the *layout* viewport (which position:fixed uses) unchanged, so a
  // naive "bottom:0" bar ends up hidden behind the keyboard until the page is
  // scrolled. Track the visual viewport and feed the gap into a CSS var.
  (function(){
    if(!window.visualViewport) return;
    function updateKbInset(){
      const vv = window.visualViewport;
      const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb-inset', inset + 'px');
    }
    window.visualViewport.addEventListener('resize', updateKbInset);
    window.visualViewport.addEventListener('scroll', updateKbInset);
    updateKbInset();
  })();
</script>
