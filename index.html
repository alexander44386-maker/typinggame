  function startTruthsGame(){
    clearCollectionTimeout();
    gamePhase = 'playing';
    let pool = [];
    Object.values(players).forEach(function(p){
      if(!p.ttInputs || !Array.isArray(p.ttInputs.statements) || p.ttInputs.statements.length !== 3) return;
      pool.push({ownerId:p.id, ownerName:p.name, statements:p.ttInputs.statements, lieIndex:p.ttInputs.lieIndex});
    });
    truthsOrder = shuffle(pool);
    truthsIndex = -1;
    truthsResponseTimes = {};
    Object.values(players).forEach(function(p){ p.score = 0; });
    const initialScores = Object.values(players).map(function(p){ return {id:p.id, name:p.name, score:0}; });
    broadcastToAll({type:'gameStart', total:truthsOrder.length, scores:initialScores});
    nextTruthsRound();
  }

  function nextTruthsRound(){
    clearTimeout(advanceTimer);
    truthsIndex++;
    if(truthsIndex >= truthsOrder.length){ endTruthsGame(); return; }
    const entry = truthsOrder[truthsIndex];
    truthsCurrentEntry = entry;
    truthsRoundOver = false;
    truthsAnsweredThisRound = new Set();
    truthsCorrectThisRound = [];
    truthsEligibleIds = Object.keys(players).filter(function(id){ return id !== entry.ownerId; });
    truthsCurrentDisplayOrder = shuffle([0,1,2]);
    truthsRoundStart = Date.now();
    const shuffledStatements = truthsCurrentDisplayOrder.map(function(i){ return entry.statements[i]; });
    broadcastToAll({type:'truthsRound', index:truthsIndex, total:truthsOrder.length, ownerId:entry.ownerId, ownerName:entry.ownerName, statements:shuffledStatements, seconds:truthsRoundSeconds});
    if(truthsEligibleIds.length === 0){
      // Nobody else is around to guess — skip straight to the reveal.
      advanceTimer = setTimeout(truthsTimeout, 1200);
    } else if(truthsRoundSeconds > 0){
      advanceTimer = setTimeout(truthsTimeout, truthsRoundSeconds * 1000);
    }
  }

  function truthsTimeout(){
    if(gamePhase !== 'playing' || truthsRoundOver) return;
    finishTruthsRound();
  }

  function finishTruthsRound(){
    truthsRoundOver = true;
    gamePhase = 'result';
    clearTimeout(advanceTimer);
    const entry = truthsCurrentEntry;
    const lieText = entry.statements[entry.lieIndex];
    const scores = Object.values(players).map(function(p){ return {id:p.id, name:p.name, score:p.score}; });
    const winnerName = truthsCorrectThisRound.length
      ? ('✅ ' + truthsCorrectThisRound.join(', ') + (truthsCorrectThisRound.length === 1 ? ' caught the lie!' : ' caught the lie!'))
      : '😅 Nobody caught the lie!';
    broadcastToAll({type:'roundResult', winnerName:winnerName, answer:lieText, ownerName:entry.ownerName, scores:scores, game:'truths'});
    advanceTimer = setTimeout(function(){
      gamePhase = 'playing';
      nextTruthsRound();
    }, 4000);
  }

  function checkTruthsRoundComplete(){
    if(truthsEligibleIds.length > 0 && truthsAnsweredThisRound.size >= truthsEligibleIds.length) finishTruthsRound();
  }

  function handleTruthsAnswer(playerId, selectedIndex){
    if(gamePhase !== 'playing' || truthsRoundOver || playerId === truthsCurrentEntry.ownerId){
      sendToPlayer(playerId, {type:'truthsAnswerResult', roundOver:true});
      return;
    }
    if(truthsAnsweredThisRound.has(playerId)){
      sendToPlayer(playerId, {type:'truthsAnswerResult', roundOver:false, alreadyAnswered:true});
      return;
    }
    truthsAnsweredThisRound.add(playerId);
    const elapsed = Date.now() - truthsRoundStart;
    const lieDisplayIndex = truthsCurrentDisplayOrder.indexOf(truthsCurrentEntry.lieIndex);
    const correct = selectedIndex === lieDisplayIndex;
    if(correct){
      if(players[playerId]) players[playerId].score += 1;
      if(!truthsResponseTimes[playerId]) truthsResponseTimes[playerId] = [];
      truthsResponseTimes[playerId].push(elapsed);
      if(players[playerId]) truthsCorrectThisRound.push(players[playerId].name);
    }
    sendToPlayer(playerId, {type:'truthsAnswerResult', roundOver:false, correct:correct, selectedIndex:selectedIndex, lieDisplayIndex:lieDisplayIndex});
    const playerName = players[playerId] ? players[playerId].name : 'Someone';
    broadcastToAll({type:'truthsProgressPing', answered:truthsAnsweredThisRound.size, eligible:truthsEligibleIds.length, name:playerName, correct:correct});
    checkTruthsRoundComplete();
  }

  function endTruthsGame(){
    gamePhase = 'gameover';
    const scores = Object.values(players).map(function(p){ return {id:p.id, name:p.name, score:p.score}; })
      .sort(function(a,b){ return b.score - a.score; });
    let speedAward = null;
    let bestAvg = Infinity;
    Object.keys(truthsResponseTimes).forEach(function(pid){
      const times = truthsResponseTimes[pid];
      if(!times.length || !players[pid]) return;
      const avg = times.reduce(function(a,b){ return a+b; }, 0) / times.length;
      if(avg < bestAvg){ bestAvg = avg; speedAward = {id:pid, name:players[pid].name, avgMs:avg}; }
    });
    const msg = {type:'gameOver', scores:scores, speedAward:speedAward};
    attachTieInfo(msg, scores);
    tbOrigSpeedAward = speedAward;
    broadcastToAll(msg);
  }


  // ---- HOSTING ----
  async function startHosting(attempt){
    attempt = attempt || 0;
    document.getElementById('landingError').textContent = '';
    roomCode = generateRoomCode();
    const iceServers = await getIceServers();
    const peerOpts = (typeof PEER_HOST !== 'undefined' && PEER_HOST)
      ? { host: PEER_HOST, port: PEER_PORT, path: PEER_PATH, key: 'peerjs', secure: PEER_SECURE,
          config: { iceServers: iceServers } }
      : { config: { iceServers: iceServers } };
    peer = new Peer(roomCode, peerOpts);
    peer.on('open', function(){
      myId = 'host';
      players = {};
      players['host'] = {id:'host', name:myName, ready:false, score:0, conn:null};
      showRoomCode(roomCode);
      $('#btnStart').hidden = false;
      $('#btnGamePickBack').hidden = false;
      syncGameExitButtons();
      $('#btnGuessWhoInputBack').hidden = false;
      $('#btnTruthsInputBack').hidden = false;
      $('#btnReady').textContent = "✋ I'm Ready";
      document.getElementById('lobbyQuestionInfo').textContent = '';
      show('screen-lobby');
      broadcastPlayers();
      startPresencePinging();
      toast('Room created! Share the code.');
    });
    peer.on('connection', function(conn){ setupHostConnection(conn); });
    peer.on('error', function(err){
      if(err.type === 'unavailable-id' && attempt < 6){
        peer.destroy();
        startHosting(attempt+1);
      } else {
        document.getElementById('landingError').textContent = 'Could not start a room. Please refresh and try again.';
      }
    });
    attachPeerLifecycleHandlers(peer, 'host');
  }

  // Re-registers the same room code after a host-side reload/crash, seeding
  // the roster (as "disconnected") from the last snapshot so that when each
  // player's own auto-reconnect logic reaches this room again, the existing
  // sessionId-matching in handleHostMessage relinks them automatically —
  // no changes needed on the player side at all.
  async function reclaimHostRoom(info){
    myName = info.myName || myName || 'Host';
    const nameInput = document.getElementById('nameInput');
    if(nameInput && myName) nameInput.value = myName;
    roomCode = info.roomCode;
    const iceServers = await getIceServers();
    const peerOpts = (typeof PEER_HOST !== 'undefined' && PEER_HOST)
      ? { host: PEER_HOST, port: PEER_PORT, path: PEER_PATH, key: 'peerjs', secure: PEER_SECURE,
          config: { iceServers: iceServers } }
      : { config: { iceServers: iceServers } };
    peer = new Peer(roomCode, peerOpts);
    peer.on('open', function(){
      role = 'host';
      myId = 'host';
      players = {};
      players['host'] = {id:'host', name:myName, ready:false, score:0, conn:null};
      (info.players || []).forEach(function(p){
        if(!p || p.id === 'host') return;
        players[p.id] = {id:p.id, name:p.name, ready:false, score:p.score||0, conn:null, disconnected:true, disconnectedAt:Date.now(), sessionId:p.sessionId||null};
      });
      showRoomCode(roomCode);
      $('#btnStart').hidden = false;
      $('#btnGamePickBack').hidden = false;
      syncGameExitButtons();
      $('#btnGuessWhoInputBack').hidden = false;
      $('#btnTruthsInputBack').hidden = false;
      $('#btnReady').textContent = "✋ I'm Ready";
      document.getElementById('lobbyQuestionInfo').textContent = '';
      broadcastPlayers();
      startPresencePinging();
      // We don't snapshot every game's internal engine state (turn order,
      // word queues, timers, etc.), so a game that was mid-flight can't be
      // silently resumed after a host reload. Rather than leaving it in
      // limbo — which is what used to happen — conclude it gracefully with
      // the last known scores, using the same resync path (lastBroadcastByType
      // + resyncPlayer) that already gets reconnecting players caught up.
      if(info.gamePhase && info.gamePhase !== 'lobby'){
        gamePhase = 'gameover';
        const scores = Object.values(players).map(function(p){ return {id:p.id, name:p.name, score:p.score}; })
          .sort(function(a,b){ return b.score - a.score; });
        const gameOverMsg = {type:'gameOver', scores:scores, interrupted:true};
        lastBroadcastByType = {gameOver: gameOverMsg};
        applyIncomingMessage(gameOverMsg);
        toast('Room reclaimed — the in-progress game ended early, but scores were saved. Waiting for players to reconnect…');
      } else {
        gamePhase = 'lobby';
        show('screen-lobby');
        toast('Room reclaimed — waiting for players to reconnect…');
      }
    });
    peer.on('connection', function(conn){ setupHostConnection(conn); });
    peer.on('error', function(err){
      clearHostState();
      if(err.type === 'unavailable-id'){
        document.getElementById('landingError').textContent = 'Could not reclaim that room — starting fresh instead.';
      }
      show('screen-landing');
    });
    attachPeerLifecycleHandlers(peer, 'host');
  }

  function setupHostConnection(conn){
    conn.on('data', function(data){ handleHostMessage(conn, data); });
    conn.on('close', function(){
      const p = players[conn.peer];
      // Only react if this closed connection is still the active one for that
      // player — a stale/late close event shouldn't clobber a fresher reconnect.
      if(!p || p.conn !== conn) return;
      p.disconnected = true;
      p.disconnectedAt = Date.now();
      toast(p.name + ' disconnected — waiting to reconnect…');
      broadcastPlayers();
      if(p.removalTimer) clearTimeout(p.removalTimer);
      p.removalTimer = setTimeout(function(){
        const stillGone = players[conn.peer];
        if(stillGone && stillGone.disconnected){
          toast(stillGone.name + ' left the room.');
          delete players[conn.peer];
          broadcastPlayers();
        }
      }, DISCONNECT_GRACE_MS);
    });
    conn.on('error', function(){});
  }

  // Migrate a player's identity (score, ready state, etc.) from an old id to a
  // new one, used when a rejoining client gets a brand-new Peer id (e.g. after
  // a page refresh) but matches a previous session via sessionId.
  function remapPlayerId(oldId, newId){
    const p = players[oldId];
    if(!p) return;
    if(p.removalTimer){ clearTimeout(p.removalTimer); p.removalTimer = null; }
    p.id = newId;
    delete players[oldId];
    players[newId] = p;
    if(guessWhoGuessers.has(oldId)){ guessWhoGuessers.delete(oldId); guessWhoGuessers.add(newId); }
    if(truthsAnsweredThisRound.has(oldId)){ truthsAnsweredThisRound.delete(oldId); truthsAnsweredThisRound.add(newId); }
    if(truthsResponseTimes[oldId]){ truthsResponseTimes[newId] = truthsResponseTimes[oldId]; delete truthsResponseTimes[oldId]; }
    const eIdx = truthsEligibleIds.indexOf(oldId);
    if(eIdx !== -1) truthsEligibleIds[eIdx] = newId;
  }

  function handleHostMessage(conn, data){
    if(!data || !data.type) return;
    // A player can end up with more than one DataConnection object briefly
    // during a reconnect (old one still finishing its teardown while a new
    // one comes up). Only 'hello' is allowed to (re)claim a player slot —
    // every other message must come from the connection currently on file
    // for that player, or it's a stray from a stale/superseded connection
    // and could corrupt state (e.g. an old client's answer landing after
    // they've already reconnected and moved on).
    if(data.type !== 'hello'){
      const owner = players[conn.peer];
      if(!owner || owner.conn !== conn) return;
    }
    if(data.type === 'hello'){
      const incomingSessionId = String(data.sessionId || '');
      let existing = players[conn.peer];
      if(!existing && incomingSessionId){
        const oldId = Object.keys(players).find(function(id){
          return players[id].disconnected && players[id].sessionId === incomingSessionId;
        });
        if(oldId){ remapPlayerId(oldId, conn.peer); existing = players[conn.peer]; }
      }
      if(gamePhase !== 'lobby' && !existing){
        conn.send({type:'errorMsg', message:'That game already started. Ask the host to open a new room.'});
        setTimeout(function(){ conn.close(); }, 200);
        return;
      }
      const name = String(data.name || 'Player').slice(0,18);
      if(existing){
        existing.conn = conn;
        existing.disconnected = false;
        existing.name = name;
        existing.sessionId = incomingSessionId || existing.sessionId;
        broadcastPlayers();
        toast(name + ' reconnected!');
        if(gamePhase !== 'lobby'){
          conn.send({type:'rejoinedMidGame', phase: gamePhase});
          resyncPlayer(conn.peer);
        }
      } else {
        players[conn.peer] = {id:conn.peer, name:name, ready:false, score:0, conn:conn, sessionId:incomingSessionId};
        broadcastPlayers();
        SFX.join();
        toast(name + ' joined!');
      }
    } else if(data.type === 'ready'){
      if(players[conn.peer]){
        players[conn.peer].ready = !!data.ready;
        broadcastPlayers();
      }
    } else if(data.type === 'answer'){
      handleAnswer(conn.peer, String(data.text || ''));
    } else if(data.type === 'doodleGuess'){
      handleDoodleGuess(conn.peer, String(data.text || ''));
    } else if(data.type === 'doodleCustomWord'){
      handleDoodleCustomWord(conn.peer, String(data.text || ''));
    } else if(data.type === 'strokeBatch'){
      hostRelayStrokeBatch(conn.peer, data.segs);
    } else if(data.type === 'doodleClear'){
      hostRelayClear(conn.peer);
    } else if(data.type === 'charadesGuess'){
      handleCharadesGuess(conn.peer, String(data.text || ''));
    } else if(data.type === 'charadesSkip'){
      handleCharadesSkip(conn.peer);
    } else if(data.type === 'henyoGuess'){
      handleHenyoGuess(conn.peer, String(data.text || ''));
    } else if(data.type === 'henyoHintSend'){
      handleHenyoHint(conn.peer, String(data.hint || ''));
    } else if(data.type === 'henyoSkip'){
      handleHenyoSkip(conn.peer);
    } else if(data.type === 'charPick'){
      if(players[conn.peer]){
        players[conn.peer].avatar = String(data.avatar || '').slice(0,4);
        broadcastPlayers();
      }
    } else if(data.type === 'typingProgress'){
      hostRelayTypingProgress(conn.peer, data.pct);
    } else if(data.type === 'typingFinish'){
      handleTypingFinish(conn.peer, Number(data.timeMs) || 0);
    } else if(data.type === 'guessWhoSubmit'){
      handleGuessWhoSubmit(conn.peer, {hobby:String(data.hobby||''), hate:String(data.hate||''), other:String(data.other||'')});
    } else if(data.type === 'guessWhoAnswer'){
      handleGuessWhoAnswer(conn.peer, String(data.text || ''));
    } else if(data.type === 'truthsSubmit'){
      const stmts = Array.isArray(data.statements) ? data.statements.slice(0,3).map(function(s){ return String(s||'').slice(0,140); }) : [];
      let lie = parseInt(data.lieIndex, 10);
      if(isNaN(lie) || lie < 0 || lie > 2) lie = 0;
      handleTruthsSubmit(conn.peer, {statements:stmts, lieIndex:lie});
    } else if(data.type === 'truthsAnswer'){
      handleTruthsAnswer(conn.peer, Number(data.selectedIndex));
    } else if(data.type === 'triviaGuess'){
      handleTriviaGuess(conn.peer, String(data.text || ''));
    } else if(data.type === 'connect4Drop'){
      handleConnect4Drop(conn.peer, data.col);
    } else if(data.type === 'pong'){
      handlePong(conn.peer, Number(data.ts));
    } else if(data.type === 'reaction'){
      handleReaction(conn.peer, String(data.emoji || ''));
    }
  }

  // Message types that establish "what a client should currently be looking
  // at" — cached so a reconnecting player can be caught back up instead of
  // just being told a game is in progress.
  const RESYNC_BROADCAST_TYPES = ['gameSelected','gameStart','question','typingRound','triviaRound','guessWhoRound','truthsRound','roundResult','connect4State','gameOver'];
  const RESYNC_PERSONAL_TYPES = ['doodleRound','charadesRound','henyoRound'];
  let lastBroadcastByType = {};

  function broadcastToAll(msg){
    Object.values(players).forEach(function(p){
      if(p.conn && !p.disconnected){ try{ p.conn.send(msg); }catch(e){} }
    });
    if(RESYNC_BROADCAST_TYPES.indexOf(msg.type) !== -1) lastBroadcastByType[msg.type] = msg;
    applyIncomingMessage(msg);
  }

  function sendToPlayer(playerId, msg){
    if(RESYNC_PERSONAL_TYPES.indexOf(msg.type) !== -1 && players[playerId]) players[playerId].lastRoundMsg = msg;
    if(playerId === 'host'){ applyIncomingMessage(msg); return; }
    const p = players[playerId];
    if(p && p.conn && !p.disconnected){ try{ p.conn.send(msg); }catch(e){} }
  }

  // Catches a reconnecting player back up to the live state of the game
  // instead of leaving them stranded on whatever screen they were on when
  // they dropped. Reuses the exact messages already sent for the current
  // round/game, so it goes through the same rendering code as everyone else.
  const RESYNC_ROUND_TYPE_BY_GAME = {rebus:'question', typing:'typingRound', trivia:'triviaRound', guesswho:'guessWhoRound', truths:'truthsRound'};
  const RESYNC_PERSONAL_TYPE_BY_GAME = {doodle:'doodleRound', charades:'charadesRound', henyo:'henyoRound'};
  function resyncPlayer(playerId){
    const p = players[playerId];
    if(!p || !p.conn) return;
    const send = function(msg){ if(msg){ try{ p.conn.send(msg); }catch(e){} } };

    if(gamePhase === 'lobby') return;

    // Game already ended while they were away — resend the final scoreboard
    // instead of leaving them stranded on whatever screen they last saw.
    if(gamePhase === 'gameover'){
      send(lastBroadcastByType.gameOver);
      return;
    }

    send(lastBroadcastByType.gameSelected);

    if(gamePhase === 'result'){
      send(lastBroadcastByType.roundResult);
      return;
    }
    if(gamePhase === 'collecting') return; // gameSelected already routes them to the right input screen

    const scores = Object.values(players).map(function(pp){ return {id:pp.id, name:pp.name, score:pp.score}; });
    if(lastBroadcastByType.gameStart) send(Object.assign({}, lastBroadcastByType.gameStart, {scores: scores}));

    const personalType = RESYNC_PERSONAL_TYPE_BY_GAME[activeGame];
    if(personalType && p.lastRoundMsg && p.lastRoundMsg.type === personalType){
      send(p.lastRoundMsg);
    } else {
      const rt = RESYNC_ROUND_TYPE_BY_GAME[activeGame];
      if(rt) send(lastBroadcastByType[rt]);
    }
  }

  function broadcastPlayers(){
    const list = Object.values(players).map(function(p){
      return {id:p.id, name:p.name, ready:p.ready, score:p.score, avatar:p.avatar, disconnected:!!p.disconnected, quality:p.quality || null};
    });
    broadcastToAll({type:'players', players:list});
    persistHostState();
  }

  function updateStartButton(list){
    if(role !== 'host') return;
    const btn = $('#btnStart');
    const allReady = list.length > 0 && list.every(function(p){ return p.ready; });
    const soloHost = list.length <= 1;
    // Normally the host can't start alone — at least one other player must
    // join and ready up. Dev mode is the only way to bypass that solo check.
    const canStart = allReady && (!soloHost || devModeUnlocked);
    btn.disabled = !canStart;
    document.getElementById('devModeBadge').hidden = !devModeUnlocked;
  }

  // ---- HIDDEN DEV MODE (tap "BCD" on the landing screen) ----
  document.getElementById('bcdTrigger').addEventListener('click', function(){
    if(devModeUnlocked){ toast('🛠️ Dev mode already unlocked!'); return; }
    const pw = prompt('Enter developer password:');
    if(pw === null) return;
    if(pw === 'bcd1'){
      devModeUnlocked = true;
      document.body.classList.add('dev-mode-active');
      if(role === 'host') updateStartButton(Object.values(players));
      document.getElementById('gameCardConnect4').hidden = !(role === 'host');
      toast('🛠️ Dev mode unlocked — solo hosting enabled!');
    } else {
      toast('❌ Incorrect password');
    }
  });

  $('#btnStart').addEventListener('click', function(){
    if(role !== 'host') return;
    broadcastToAll({type:'proceedToPicker'});
  });

  function startRebusGame(){
    gamePhase = 'playing';
    const fullOrder = shuffle(QUESTIONS.map(function(_,i){ return i; }));
    const count = Math.max(1, Math.min(questionsToPlay || QUESTIONS.length, QUESTIONS.length));
    questionOrder = fullOrder.slice(0, count);
    currentIndex = -1;
    Object.values(players).forEach(function(p){ p.score = 0; });
    const initialScores = Object.values(players).map(function(p){ return {id:p.id, name:p.name, score:0}; });
    broadcastToAll({type:'gameStart', total:questionOrder.length, scores:initialScores});
    nextQuestion();
  }

  // ---- DOODLE DASH: host-only game logic ----
  function startDoodleGame(){
    gamePhase = 'playing';
    doodleWordsUsed = [];
    let order = [];
    for(let r=0; r<doodleRoundsPerPlayer; r++){
      order = order.concat(shuffle(Object.keys(players)));
    }
    doodleTurnOrder = order;
    doodleTurnIndex = -1;
    Object.values(players).forEach(function(p){ p.score = 0; });
    const initialScores = Object.values(players).map(function(p){ return {id:p.id, name:p.name, score:0}; });
    broadcastToAll({type:'gameStart', total:doodleTurnOrder.length, scores:initialScores});
    nextDoodleRound();
  }

  function nextDoodleRound(){
    clearTimeout(advanceTimer);
    doodleTurnIndex++;
    if(doodleTurnIndex >= doodleTurnOrder.length){ endGame(); return; }
    const drawerId = doodleTurnOrder[doodleTurnIndex];
    if(!players[drawerId]){ nextDoodleRound(); return; } // drawer left the room, skip their turn
    currentDrawerId = drawerId;
    const cat = DOODLE_CATEGORIES[doodleCategoryKey] || DOODLE_CATEGORIES.animals;
    let pool = cat.items.filter(function(w){ return doodleWordsUsed.indexOf(w) === -1; });
    if(pool.length === 0){ doodleWordsUsed = []; pool = cat.items.slice(); }
    const word = pool[Math.floor(Math.random() * pool.length)];
    doodleWordsUsed.push(word);
    currentWord = word;
    doodleRoundOver = false;
    const drawerName = players[drawerId].name;
    Object.values(players).forEach(function(p){
      const isDrawer = p.id === drawerId;
      sendToPlayer(p.id, {
        type:'doodleRound', index:doodleTurnIndex, total:doodleTurnOrder.length,
        drawerId:drawerId, drawerName:drawerName, isDrawer:isDrawer,
        word: isDrawer ? word : null, category: cat.label, seconds: doodleRoundSeconds,
        tbIds: tbActive ? tbTiedIds : null
      });
    });
    if(doodleRoundSeconds > 0){
      advanceTimer = setTimeout(doodleTimeout, doodleRoundSeconds * 1000);
    }
  }

  function doodleTimeout(){
    if(gamePhase !== 'playing' || doodleRoundOver) return;
    doodleRoundOver = true;
    gamePhase = 'result';
    const scores = Object.values(players).map(function(p){ return {id:p.id, name:p.name, score:p.score}; });
    broadcastToAll({type:'roundResult', winnerName:"⏰ Time's up! Nobody guessed it", answer:currentWord, scores:scores});
    advanceTimer = setTimeout(function(){ gamePhase = 'playing'; nextDoodleRound(); }, 4000);
  }

  // ---- TYPING RACE: host-only game logic ----
  // Both sentences in a topic are combined into a single typing round so
  // players type them together in one go. There's no time limit — the race
  // ends as soon as one player finishes. Hosts may choose 1 or 2 rounds;
  // in round 2, a random (different) topic is used and only the top 4
  // scorers from round 1 are eligible to play — everyone else spectates.

  function startTypingGame(){
    gamePhase = 'playing';
    typingRoundIndex = -1;
    typingEligibleIds = null;
    Object.values(players).forEach(function(p){ p.score = 0; });
    broadcastToAll({type:'gameStart', total:typingRoundsTarget, scores:[]});
    nextTypingRound();
  }

  function nextTypingRound(){
    typingRoundIndex++;
    if(typingRoundIndex >= typingRoundsTarget){ endGame(); return; }

    let topicKey = typingTopicKey;
    if(typingRoundIndex === 0){
      typingEligibleIds = tbActive ? tbTiedIds.slice() : null; // tie-breaker: only tied players race
    } else {
      // Round 2: random topic (different from round 1 if possible), top 4 scorers only.
      const otherKeys = Object.keys(TYPING_TOPICS).filter(function(k){ return k !== typingTopicKey; });
      const pool = otherKeys.length ? otherKeys : Object.keys(TYPING_TOPICS);
      topicKey = pool[Math.floor(Math.random() * pool.length)];
      const sorted = Object.values(players).slice().sort(function(a,b){ return b.score - a.score; });
      typingEligibleIds = sorted.slice(0,4).map(function(p){ return p.id; });
    }

    const topic = TYPING_TOPICS[topicKey] || TYPING_TOPICS.islands;
    const sentenceCount = typingRoundIndex === 0 ? 3 : 4; // round 1: 3 sentences, round 2: 4 sentences
    const order = shuffle(topic.sentences.map(function(_,i){ return i; })).slice(0, Math.min(sentenceCount, topic.sentences.length));
    typingText = order.map(function(i){ return topic.sentences[i]; }).join(' ');
    typingRoundOver = false;
    typingFinishOrder = [];
    typingFinishCandidates = [];
    if(typingFinishGraceTimer){ clearTimeout(typingFinishGraceTimer); typingFinishGraceTimer = null; }
    Object.values(players).forEach(function(p){ p.typingPct = 0; });
    const roster = Object.values(players).map(function(p){
      return {id:p.id, name:p.name, avatar:p.avatar||'', eligible: !typingEligibleIds || typingEligibleIds.indexOf(p.id) !== -1};
    });
    broadcastToAll({
      type:'typingRound', index:typingRoundIndex, total:typingRoundsTarget,
      text:typingText, players:roster, isEliminationRound: !!typingEligibleIds,
      tieBreak: tbActive
    });
  }

  function hostRelayTypingProgress(fromId, pct){
    if(!players[fromId]) return;
    players[fromId].typingPct = pct;
    Object.values(players).forEach(function(p){
      if(p.id === fromId) return;
      if(p.id === 'host'){ updateRaceTrackFor(fromId, pct); }
      else if(p.conn){ p.conn.send({type:'typingProgress', id:fromId, pct:pct}); }
    });

  function handleTypingFinish(playerId, timeMs){
    if(gamePhase !== 'playing' || typingRoundOver) return;
    if(!players[playerId]) return;
    if(typingEligibleIds && typingEligibleIds.indexOf(playerId) === -1) return; // spectating this round
    if(typingFinishCandidates.some(function(c){ return c.id === playerId; })) return;
    typingFinishCandidates.push({id:playerId, timeMs: Number(timeMs) || 0});
    players[playerId].typingPct = 100;
    // Provisional per-arrival update so the race UI still lights up live as
    // people finish. The actual winner/score, though, isn't locked in here —
    // see finalizeTypingRoundWinner — because whoever's "I'm done" packet
    // happens to arrive at the host first isn't necessarily who typed
    // fastest; network latency shouldn't decide the race.
    broadcastToAll({type:'typingFinishUpdate', id:playerId, name:players[playerId].name, place:typingFinishCandidates.length, timeMs:timeMs});
    if(!typingFinishGraceTimer){
      // Brief grace window after the first finisher lets near-simultaneous
      // finishers' messages catch up before we rank by their own reported
      // elapsed time rather than by arrival order.
      typingFinishGraceTimer = setTimeout(finalizeTypingRoundWinner, TYPING_FINISH_GRACE_MS);
    }
  }

  function finalizeTypingRoundWinner(){
    typingFinishGraceTimer = null;
    if(typingRoundOver) return;
    const ranked = typingFinishCandidates.slice().sort(function(a,b){ return a.timeMs - b.timeMs; });
    typingFinishOrder = ranked.map(function(c){ return c.id; });
    if(ranked.length && players[ranked[0].id]) players[ranked[0].id].score += 1; // tracked silently, only shown in final results
    endTypingRound();
  }

  function endTypingRound(){
    if(typingRoundOver) return;
    typingRoundOver = true;
    gamePhase = 'result';
    const winner = typingFinishOrder.length ? players[typingFinishOrder[0]] : null;

  // ---- CONNECT 4 (dev mode only) ----
  function startConnect4Game(opponentId){
    gamePhase = 'playing';
    c4Board = Array.from({length:6}, function(){ return Array(7).fill(null); });
    c4RedId = 'host';
    c4YellowId = opponentId;
    c4Turn = 'red';
    c4GameOver = false;
    Object.values(players).forEach(function(p){ p.score = 0; });
    const initialScores = Object.values(players).map(function(p){ return {id:p.id, name:p.name, score:0}; });
    broadcastToAll({type:'gameStart', scores:initialScores});
    broadcastConnect4State();

  function broadcastConnect4State(winnerId, draw, lastMove){
    broadcastToAll({
      type:'connect4State', board:c4Board, turn:c4GameOver ? null : c4Turn,
      redId:c4RedId, yellowId:c4YellowId,
      redName: players[c4RedId] ? players[c4RedId].name : 'Red',
      yellowName: players[c4YellowId] ? players[c4YellowId].name : 'Yellow',
      winnerId: winnerId || null, draw: !!draw, lastMove: lastMove || null
    });
  }

  function c4CheckWin(row, col, color){
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for(let d=0; d<dirs.length; d++){
      const dr = dirs[d][0], dc = dirs[d][1];
      let count = 1;
      let r = row + dr, c = col + dc;
      while(r>=0 && r<6 && c>=0 && c<7 && c4Board[r][c] === color){ count++; r+=dr; c+=dc; }
      r = row - dr; c = col - dc;
      while(r>=0 && r<6 && c>=0 && c<7 && c4Board[r][c] === color){ count++; r-=dr; c-=dc; }
      if(count >= 4) return true;
    }
    return false;
  }

  function handleConnect4Drop(playerId, col){
    if(gamePhase !== 'playing' || activeGame !== 'connect4' || c4GameOver) return;
    col = parseInt(col, 10);
    if(isNaN(col) || col < 0 || col > 6) return;
    const turnId = c4Turn === 'red' ? c4RedId : c4YellowId;
    if(playerId !== turnId) return;
    let row = -1;
    for(let r=5; r>=0; r--){
      if(!c4Board[r][col]){ row = r; break; }
    }
    if(row === -1) return; // column full
    const color = c4Turn;
    c4Board[row][col] = color;
    const winnerColor = c4CheckWin(row, col, color);
    const isFull = c4Board.every(function(rowArr){ return rowArr.every(function(cell){ return cell; }); });
    if(winnerColor){
      c4GameOver = true;
      const winnerId = color === 'red' ? c4RedId : c4YellowId;
      if(players[winnerId]) players[winnerId].score += 1;
      broadcastConnect4State(winnerId, false, {row:row, col:col});
      setTimeout(function(){ if(activeGame === 'connect4') endGame(); }, 1800);
    } else if(isFull){
      c4GameOver = true;
      broadcastConnect4State(null, true, {row:row, col:col});
      setTimeout(function(){ if(activeGame === 'connect4') endGame(); }, 1800);
    } else {
      c4Turn = (c4Turn === 'red') ? 'yellow' : 'red';
      broadcastConnect4State(null, false, {row:row, col:col});
    }
  }

  // ---- TIE-BREAKER: host-only logic ----
  function tbOutsiderIds(){
    return Object.values(players).filter(function(p){
      return tbTiedIds.indexOf(p.id) === -1 && !p.disconnected;
    }).map(function(p){ return p.id; });
  }

  // Works out who (if anyone) is tied for first and tags the gameOver message.
  // Needs a top score above 0 and at least two still-connected tied players.
  // Connect 4 is a head-to-head game, so it never offers a tie-breaker.
  function attachTieInfo(msg, scores){
    tbOrigScores = scores;
    tbOrigGame = activeGame;
    tbTiedIds = [];
    msg.origGame = activeGame;
    if(activeGame === 'connect4' || !scores.length) return;
    const top = scores[0].score;
    if(top <= 0) return;
    const tied = scores.filter(function(s){
      return s.score === top && players[s.id] && !players[s.id].disconnected;
    });
    if(tied.length < 2) return;
    tbTiedIds = tied.map(function(s){ return s.id; });
    msg.tied = tied.map(function(s){ return {id:s.id, name:s.name}; });
    msg.tieOutsiders = tbOutsiderIds().length;
  }

  function startTieBreak(key){
    if(role !== 'host' || gamePhase !== 'gameover') return;
    const live = tbTiedIds.filter(function(id){ return players[id] && !players[id].disconnected; });
    if(live.length < 2){ toast('Not enough tied players are connected for a tie-breaker.'); return; }
    tbTiedIds = live;
    const outsiders = tbOutsiderIds();
    if((key === 'doodle' || key === 'charades') && !outsiders.length){
      toast('That game needs someone outside the tie to ' + (key === 'doodle' ? 'draw' : 'act') + '.');
      return;
    }
    clearTimeout(advanceTimer);
    tbActive = true;
    tbGameKey = key;
    Object.values(players).forEach(function(p){ p.score = 0; });
    const zero = Object.values(players).map(function(p){ return {id:p.id, name:p.name, score:0}; });
    const pickOne = function(arr){ return arr[Math.floor(Math.random() * arr.length)]; };
    gamePhase = 'playing';

    if(key === 'doodle'){
      if(!(doodleRoundSeconds > 0)) doodleRoundSeconds = DOODLE_ROUND_SECONDS;
      broadcastToAll({type:'gameSelected', game:'doodle', category:doodleCategoryKey, roundsPerPlayer:1, seconds:doodleRoundSeconds});
      doodleWordsUsed = [];
      doodleTurnOrder = [pickOne(outsiders)];   // random non-tied player draws
      doodleTurnIndex = -1;
      broadcastToAll({type:'gameStart', total:1, scores:zero});
      nextDoodleRound();
    } else if(key === 'charades'){
      if(!(charadesRoundSeconds > 0)) charadesRoundSeconds = CHARADES_ROUND_SECONDS;
      broadcastToAll({type:'gameSelected', game:'charades', category:charadesCategoryKey, roundsPerPlayer:1, seconds:charadesRoundSeconds});
      charadesWordsUsed = [];
      charadesTurnOrder = [pickOne(outsiders)]; // random non-tied player acts
      charadesTurnIndex = -1;
      broadcastToAll({type:'gameStart', total:1, scores:zero});
      nextCharadesRound();
    } else if(key === 'typing'){
      typingRoundsTarget = 1;
      broadcastToAll({type:'gameSelected', game:'typing', topic:typingTopicKey, rounds:1});
      typingRoundIndex = -1;
      broadcastToAll({type:'gameStart', total:1, scores:[]});
      nextTypingRound();
    } else if(key === 'trivia'){
      if(!(triviaRoundSeconds > 0)) triviaRoundSeconds = 20;
      broadcastToAll({type:'gameSelected', game:'trivia', seconds:triviaRoundSeconds});
      triviaQueue = buildTriviaQueue(Object.keys(TRIVIA_CATEGORIES), 1);
      triviaIndex = -1;
      broadcastToAll({type:'gameStart', total:triviaQueue.length, scores:zero});
      nextTriviaRound();
    } else {
      if(!(rebusRoundSeconds > 0)) rebusRoundSeconds = 30;
      broadcastToAll({type:'gameSelected', game:'rebus'});
      questionOrder = [Math.floor(Math.random() * QUESTIONS.length)];
      currentIndex = -1;
      broadcastToAll({type:'gameStart', total:1, scores:zero});
      nextQuestion();
    }
  }

  // Called from endGame() when the one-round tie-breaker finishes.
  function concludeTieBreak(){
    clearTimeout(advanceTimer);
    const contenders = tbTiedIds.map(function(id){ return players[id]; }).filter(Boolean);
    let best = 0;
    contenders.forEach(function(p){ if(p.score > best) best = p.score; });
    const leaders = best > 0 ? contenders.filter(function(p){ return p.score === best; }) : [];
    tbActive = false;
    // Put the real scoreboard back — the tie-breaker never changes it.
    (tbOrigScores || []).forEach(function(s){ if(players[s.id]) players[s.id].score = s.score; });
    gamePhase = 'gameover';
    const msg = {type:'gameOver', scores:(tbOrigScores || []).slice(), origGame:tbOrigGame};
    if(tbOrigSpeedAward) msg.speedAward = tbOrigSpeedAward;
    if(leaders.length === 1){
      msg.tieBreak = {winnerId:leaders[0].id, winnerName:leaders[0].name, game:tbGameKey};
      tbTiedIds = [];
    } else {
      // Nobody got it (e.g. time ran out) — the tie stands, so offer another go.
      msg.tieBreak = {winnerId:null, game:tbGameKey};
      msg.tied = contenders.map(function(p){ return {id:p.id, name:p.name}; });
      msg.tieOutsiders = tbOutsiderIds().length;
    }
    broadcastToAll(msg);
  }

  // ---- JOINING ----
  async function joinRoom(code, isAutoRejoin){
    document.getElementById('landingError').textContent = '';
    const iceServers = await getIceServers();
    const peerOpts = (typeof PEER_HOST !== 'undefined' && PEER_HOST)
      ? { host: PEER_HOST, port: PEER_PORT, path: PEER_PATH, key: 'peerjs', secure: PEER_SECURE,
          config: { iceServers: iceServers } }
      : { config: { iceServers: iceServers } };
    peer = new Peer(undefined, peerOpts);
    peer.on('open', function(){
      myId = peer.id;
      connectToHost(code, false);
    });
    peer.on('error', function(err){
      if(err.type === 'peer-unavailable'){
        document.getElementById('landingError').textContent = 'Room not found. Double-check the code.';
        clearRejoinInfo();
      } else if(!isAutoRejoin){
        document.getElementById('landingError').textContent = 'Connection error: ' + err.type;
      }
    });
    attachPeerLifecycleHandlers(peer, 'client');
  }

  // Opens (or re-opens) the data connection to the host over an existing Peer.
  // isReconnect distinguishes a silent retry (after a drop) from the first attempt.
  function connectToHost(code, isReconnect){
    hostConn = peer.connect(code, {reliable:true});
    let connected = false;
    const timeout = setTimeout(function(){
      if(!connected){
        if(isReconnect){ scheduleReconnectRetry(code); }
        else document.getElementById('landingError').textContent = 'Could not reach that room. Check the code and try again.';
      }
    }, 8000);
    hostConn.on('open', function(){
      connected = true;
      clearTimeout(timeout);
      reconnectAttemptsLeft = 5;
      hostConn.send({type:'hello', name:myName, sessionId:mySessionId});
      roomCode = code;
      saveRejoinInfo(code);
      showRoomCode(code);
      $('#btnStart').hidden = true;
      syncGameExitButtons();
      $('#btnReady').textContent = "✋ I'm Ready";
      document.getElementById('lobbyQuestionInfo').textContent = '';
      show('screen-lobby');
      if(isReconnect) toast('Reconnected!');
    });
    hostConn.on('data', function(data){ saveRejoinInfo(roomCode); applyIncomingMessage(data); });
    hostConn.on('close', function(){
      if(wasKicked) return;
      scheduleReconnectRetry(code);
    });
    hostConn.on('error', function(){
      if(!isReconnect) document.getElementById('landingError').textContent = 'Connection error. Please try again.';
    });
  }

  // A dropped data channel (screen lock, backgrounding, brief network blip) doesn't
  // necessarily mean the Peer itself died, so retry a few times before giving up.
  function scheduleReconnectRetry(code){
    if(wasKicked) return;
    if(reconnectAttemptsLeft <= 0){
      document.getElementById('landingError').textContent = 'Lost connection to the host.';
      clearRejoinInfo();
      show('screen-landing');
      return;
    }
    reconnectAttemptsLeft--;
    toast('Connection lost — reconnecting…');
    setTimeout(function(){
      if(peer && !peer.destroyed){ connectToHost(code, true); }
    }, 1200);
  }

  // ---- PROACTIVE RECONNECT ON RETURN TO FOREGROUND ----
  // Phones freeze JS timers and often silently kill WebRTC data channels while
  // backgrounded or locked. Waiting for PeerJS to notice a dead connection can
  // take a while after the tab wakes back up, so as soon as the app becomes
  // visible again we proactively check the connection ourselves.
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    if(role === 'host'){
      // Nudge every connection immediately rather than waiting for the next
      // scheduled ping, so stale/half-dead links surface right away.
      if(peer && !peer.destroyed) pingAllPlayers();
      return;
    }
    if(role !== 'client' || !roomCode) return;
    if(!hostConn || !hostConn.open){
      if(peer && !peer.destroyed){
        connectToHost(roomCode, true);
      }
    }
  });

  // ---- DOODLE DASH: canvas drawing (both host and client) ----
  function getDoodleCanvas(){ return document.getElementById('doodleCanvas'); }
  function getDoodleCtx(){ return getDoodleCanvas().getContext('2d'); }

  function clearDoodleCanvas(){
    const ctx = getDoodleCtx();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, DOODLE_W, DOODLE_H);
  }

  function drawSegmentOnCanvas(seg){
    const ctx = getDoodleCtx();
    ctx.strokeStyle = seg.color;
    ctx.lineWidth = seg.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(seg.x0, seg.y0);
    ctx.lineTo(seg.x1, seg.y1);
    ctx.stroke();
  }

  function canvasPointFromEvent(e){
    const canvas = getDoodleCanvas();
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (DOODLE_W / rect.width),
      y: (e.clientY - rect.top) * (DOODLE_H / rect.height)
    };
  }

  // Strokes are buffered for a short window and sent as a batch instead of
  // one network message per pointermove segment — rapid drawing was
  // producing a large number of tiny messages that the host then had to
  // relay individually to every other player. Local drawing stays instant
  // (drawSegmentOnCanvas runs immediately on pointermove); only the network
  // send is batched, so there's no visible drawing lag for the artist.
  const DOODLE_BATCH_MS = 40;
  let doodleStrokeBuffer = [];
  let doodleFlushTimer = null;
  function flushDoodleStrokes(){
    doodleFlushTimer = null;
    if(!doodleStrokeBuffer.length) return;
    const segs = doodleStrokeBuffer;
    doodleStrokeBuffer = [];
    if(role === 'host'){ hostRelayStrokeBatch('host', segs); }
    else if(hostConn){ hostConn.send({type:'strokeBatch', segs:segs}); }
  }
  function emitStroke(seg){
    doodleStrokeBuffer.push(seg);
    if(!doodleFlushTimer) doodleFlushTimer = setTimeout(flushDoodleStrokes, DOODLE_BATCH_MS);
  }
  function emitClear(){
    doodleStrokeBuffer = [];
    if(doodleFlushTimer){ clearTimeout(doodleFlushTimer); doodleFlushTimer = null; }
    if(role === 'host'){ hostRelayClear('host'); }
    else if(hostConn){ hostConn.send({type:'doodleClear'}); }
  }

  const doodleCanvasEl = document.getElementById('doodleCanvas');
  doodleCanvasEl.addEventListener('pointerdown', function(e){
    if(!isDrawerNow) return;
    e.preventDefault();
    doodleDrawing = true;
    lastDoodlePt = canvasPointFromEvent(e);
    const wrap = doodleCanvasEl.closest('.doodle-canvas-wrap');
    if(wrap) wrap.classList.add('drawing');
  });
  doodleCanvasEl.addEventListener('pointermove', function(e){
    if(!isDrawerNow || !doodleDrawing) return;
    e.preventDefault();
    const pt = canvasPointFromEvent(e);
    const seg = {x0:lastDoodlePt.x, y0:lastDoodlePt.y, x1:pt.x, y1:pt.y, color:doodleColor, size:doodleSize};
    drawSegmentOnCanvas(seg);
    emitStroke(seg);
    lastDoodlePt = pt;
  });
  function stopDoodleDrawing(){
    doodleDrawing = false; lastDoodlePt = null;
    flushDoodleStrokes(); // send the tail end of the stroke right away, don't wait for the batch timer
    const wrap = doodleCanvasEl.closest('.doodle-canvas-wrap');
    if(wrap) wrap.classList.remove('drawing');
  }
  doodleCanvasEl.addEventListener('pointerup', stopDoodleDrawing);
  doodleCanvasEl.addEventListener('pointerleave', stopDoodleDrawing);
  window.addEventListener('pointerup', stopDoodleDrawing);

  // ---- DOODLE DASH: mobile condensed toolbar (tap a trigger to reveal pens/colors) ----

  const doodleThicknessTrigger = document.getElementById('doodleThicknessTrigger');

  const doodleThicknessTriggerDot = document.getElementById('doodleThicknessTriggerDot');

  function closeDoodleRow(rowEl, triggerBtn){
    if(!rowEl) return;
    rowEl.classList.remove('open');
    if(triggerBtn){ triggerBtn.classList.remove('open'); triggerBtn.setAttribute('aria-expanded', 'false'); }
  }
  function toggleDoodleRow(rowEl, triggerBtn, otherRowEl, otherTriggerBtn){
    const willOpen = !rowEl.classList.contains('open');
    closeDoodleRow(otherRowEl, otherTriggerBtn);
    if(willOpen){
      rowEl.classList.add('open');
      triggerBtn.classList.add('open');
      triggerBtn.setAttribute('aria-expanded', 'true');
    } else {
      closeDoodleRow(rowEl, triggerBtn);
    }
  }
  if(doodleColorTrigger && doodleThicknessTrigger){
    doodleColorTrigger.addEventListener('click', function(){
      toggleDoodleRow(doodleColorRowEl, doodleColorTrigger, doodleThicknessRowEl, doodleThicknessTrigger);
    });
    doodleThicknessTrigger.addEventListener('click', function(){
      toggleDoodleRow(doodleThicknessRowEl, doodleThicknessTrigger, doodleColorRowEl, doodleColorTrigger);
    });
    document.addEventListener('click', function(e){
      const toolbar = document.getElementById('doodleToolbar');
      if(toolbar && !toolbar.contains(e.target)){
        closeDoodleRow(doodleColorRowEl, doodleColorTrigger);

  // Desktop-only helper for guessers: shows every word in the active category
  // so young players can recognize the answer instead of having to type it.
  // Hidden for the current drawer, and only shown at all when dev mode is
  // unlocked (CSS also keeps it off phone-sized screens).
  function renderDoodleWordBank(){
    const bank = document.getElementById('doodleWordBank');
    const list = document.getElementById('doodleWordBankList');
    if(!bank || !list) return;
    if(isDrawerNow || tbSpectatorNow || !devModeUnlocked){ bank.hidden = true; return; }
    doodleDragGuessesLeft = DOODLE_DRAG_GUESS_LIMIT;
    const cat = DOODLE_CATEGORIES[doodleCategoryKey] || DOODLE_CATEGORIES.animals;
    list.innerHTML = cat.items.map(function(word){
      return '<button type="button" class="doodle-word-bank-chip" draggable="true" data-word="' + word + '">' + word + '</button>';
    }).join('');
    list.querySelectorAll('.doodle-word-bank-chip').forEach(function(chip){
      chip.addEventListener('dragstart', function(e){
        if(doodleDragGuessesLeft <= 0){ e.preventDefault(); return; }
        e.dataTransfer.setData('text/plain', chip.dataset.word);
        e.dataTransfer.effectAllowed = 'copy';
        chip.classList.add('dragging');
      });
      chip.addEventListener('dragend', function(){ chip.classList.remove('dragging'); });
    });
    bank.hidden = false;
    updateDoodleWordBankAttemptsUI();
  }

  // Reflects the remaining drag-and-drop guesses on the word bank chips/hint,
  // so joiners can't just drag every word one-by-one to brute-force the answer.
  function updateDoodleWordBankAttemptsUI(){
    const hint = document.getElementById('doodleWordBankHint');
    const list = document.getElementById('doodleWordBankList');
    const locked = doodleDragGuessesLeft <= 0;
    if(list){
      list.querySelectorAll('.doodle-word-bank-chip').forEach(function(chip){
        chip.draggable = !locked;
        chip.classList.toggle('doodle-word-bank-chip--locked', locked);
      });
    }
    if(hint){
      hint.textContent = locked
        ? 'No more drag guesses this round — type your guess instead!'
        : 'Drag a word onto the guess box! (' + doodleDragGuessesLeft + ' left)';
    }
  }

  // Word bank drop target: dropping a chip fills the guess box and submits it,
  // consuming one of the limited drag-and-drop guesses.
  (function setupDoodleWordBankDropzone(){
    const dropzone = document.getElementById('doodleGuessWrap');
    if(!dropzone) return;
    dropzone.addEventListener('dragover', function(e){
      if(isDrawerNow || doodleDragGuessesLeft <= 0) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      dropzone.classList.add('drag-over');
    });
    dropzone.addEventListener('dragleave', function(){
      dropzone.classList.remove('drag-over');
    });
    dropzone.addEventListener('drop', function(e){
      e.preventDefault();
      dropzone.classList.remove('drag-over');
      if(isDrawerNow || doodleDragGuessesLeft <= 0) return;
      const word = e.dataTransfer.getData('text/plain');
      if(!word) return;
      doodleDragGuessesLeft--;
      updateDoodleWordBankAttemptsUI();
      const input = document.getElementById('doodleGuessInput');
      if(input) input.value = word;
      submitDoodleGuess();
    });
  })();

    document.getElementById('triviaPromptLabel').textContent = data.prompt || '';
    const bigEl = document.getElementById('triviaClueBig');
    const textEl = document.getElementById('triviaClueText');

    textEl.hidden = true;
    logoEl.hidden = true;
